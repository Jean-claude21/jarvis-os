name: Backup

# Each night (spec 022): the production database kept as a Neon branch `backup-main-<day>`, the last
# three kept. Runs only once the repository's secret NEON_API_KEY is set; prints no secret.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Is the Neon key set?
        id: key
        run: echo "set=${{ secrets.NEON_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.key.outputs.set == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.set == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.set == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.key.outputs.set == 'true'
      - name: Back up main
        if: steps.key.outputs.set == 'true'
        run: pnpm backup
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          JARVIS_NEON_PROJECT_ID: ${{ vars.JARVIS_NEON_PROJECT_ID }}
