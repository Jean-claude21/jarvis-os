name: CI

# A pull request is checked once; merged one at a time, dev holds exactly what was checked, so a
# push to dev is not checked again.
on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secret in the repository or its history (gitleaks, values redacted)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  static:
    # Lint, types and formatting need no database: they run beside the tests and answer in minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, formatting
        run: pnpm lint && pnpm typecheck && pnpm format:check

  check:
    # Each package's tests on a database of their own, on the runner itself: Postgres beside the
    # tests, no network between them — and core and api side by side.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ['@jarvis-os/core', '@jarvis-os/api']
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # Reached only from the runner itself, for one run: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      JARVIS_TEST_OWNER_URL: postgres://jarvis_owner@localhost:5432/jarvis
      JARVIS_TEST_APP_URL: postgres://jarvis_app@localhost:5432/jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Its database (roles as on Neon)
        run: psql postgres://postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -q -f tooling/ci/postgres.sql
      - name: Tests
        run: pnpm --filter "${{ matrix.package }}" test
        env:
          JARVIS_TEST_STORAGE_ENDPOINT: ${{ secrets.JARVIS_TEST_STORAGE_ENDPOINT }}
          JARVIS_TEST_STORAGE_REGION: ${{ secrets.JARVIS_TEST_STORAGE_REGION }}
          JARVIS_TEST_STORAGE_BUCKET: ${{ secrets.JARVIS_TEST_STORAGE_BUCKET }}
          JARVIS_TEST_STORAGE_ACCESS_KEY_ID: ${{ secrets.JARVIS_TEST_STORAGE_ACCESS_KEY_ID }}
          JARVIS_TEST_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.JARVIS_TEST_STORAGE_SECRET_ACCESS_KEY }}
          JARVIS_TEST_AUTH_SECRET: ${{ secrets.JARVIS_TEST_AUTH_SECRET }}
