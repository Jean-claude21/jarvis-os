name: CI

# A pull request is checked once; merged one at a time, dev holds exactly what was checked, so a
# push to dev is not checked again.
on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secret in the repository or its history (gitleaks, values redacted)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  static:
    # Lint, types and formatting need no database: they run beside the tests and answer in minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, formatting
        run: pnpm lint && pnpm typecheck && pnpm format:check

  check:
    runs-on: ubuntu-latest
    # The suite runs file after file against a database of its own: a Neon branch copied from
    # « test » for this run, removed after — so pull requests are checked side by side.
    timeout-minutes: 40
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      JARVIS_NEON_PROJECT_ID: ${{ vars.JARVIS_NEON_PROJECT_ID }}
      RUN_BRANCH: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A database of its own (a branch of « test »)
        run: node tooling/ci-branch.mjs create "$RUN_BRANCH"
        env:
          JARVIS_TEST_OWNER_URL: ${{ secrets.JARVIS_TEST_OWNER_URL }}
          JARVIS_TEST_APP_URL: ${{ secrets.JARVIS_TEST_APP_URL }}
      - name: Migrate it
        run: pnpm db:migrate
      - name: Tests (on its own branch)
        run: pnpm test
        env:
          JARVIS_TEST_STORAGE_ENDPOINT: ${{ secrets.JARVIS_TEST_STORAGE_ENDPOINT }}
          JARVIS_TEST_STORAGE_REGION: ${{ secrets.JARVIS_TEST_STORAGE_REGION }}
          JARVIS_TEST_STORAGE_BUCKET: ${{ secrets.JARVIS_TEST_STORAGE_BUCKET }}
          JARVIS_TEST_STORAGE_ACCESS_KEY_ID: ${{ secrets.JARVIS_TEST_STORAGE_ACCESS_KEY_ID }}
          JARVIS_TEST_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.JARVIS_TEST_STORAGE_SECRET_ACCESS_KEY }}
          JARVIS_TEST_AUTH_SECRET: ${{ secrets.JARVIS_TEST_AUTH_SECRET }}
      - name: Remove its database
        if: always()
        run: node tooling/ci-branch.mjs delete "$RUN_BRANCH"
