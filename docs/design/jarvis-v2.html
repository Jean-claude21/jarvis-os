    <title>Jarvis — maquette</title>
    <!--
  Maquette de la plateforme (proposition, pas encore le produit). Données fictives : ce dépôt est public.
  Ce qu'elle montre :
  - « Maintenant » : ce qui compte, trié par urgence, avec les choix préparés ;
  - deux apps construites avec Claude, sans code : Finances (comptes, fonds protégés, obligations,
    rapprochement — la structure du Life OS) et Routines (habitudes, gabarit de journée, régularité) ;
  - les tableaux de bord, l'agenda, les fichiers, et les modèles de type (champs, relations, calculs,
    règles, rangement à l'export — configurables).
  Les textes sont écrits en dur ici ; dans l'app, ils viendront du catalogue de mots.
-->

      }
      .bar > i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--ink);
        border-radius: 1px;
      }
      .bar.ok > i {
        background: var(--success);
      }
      .bar.warn > i {
        background: var(--ochre);
      }
      .bar.info > i {
        background: var(--info);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        font-size: 12.5px;
        background: var(--paper);
        text-decoration: none;
        white-space: nowrap;
      }
      .chip small {
        color: var(--faint);
        font:
          500 11px 'JetBrains Mono',
          monospace;
      }
      .chip[aria-pressed='true'] {
        border-color: var(--ink);
        font-weight: 600;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .banner {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        border: 1px solid var(--verify);
        background: var(--verify-surface);
        color: var(--verify);
        border-radius: 2px;
        flex-wrap: wrap;
      }
      .banner b {
        color: var(--ink);
      }
      .banner .btn {
        margin-left: auto;
      }
      .hint {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 14px;
        border: 1px dashed var(--info);
        background: var(--info-surface);
        color: var(--info);
        border-radius: 2px;
        font-size: 13px;
      }
      .hint em {
        font-style: normal;
        color: var(--ink);
      }

      /* Charts */
      .chart {
        width: 100%;
        height: auto;
        display: block;
      }
      .chart text {
        fill: var(--faint);
        font:
          500 10.5px 'JetBrains Mono',
          monospace;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--bark);
        font-size: 12px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .hbar {
        display: grid;
        grid-template-columns: 110px 1fr 92px;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
        font-size: 13px;
      }
      .hbar .track {
        position: relative;
        height: 10px;
        background: var(--clay);
        border-radius: 1px;
      }
      .hbar .fill {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--ink);
        border-radius: 1px;
      }
      .hbar .fill.over {
        background: var(--error);
      }
      .hbar .budget {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        background: var(--primary);
      }
      .heat {
        display: grid;
        gap: 3px;
        align-items: center;
      }
      .heat .lbl {
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 8px;
      }
      .heat .c {
        aspect-ratio: 1;
        border-radius: 2px;
        background: var(--heat-0);
        min-width: 8px;
      }
      .heat .c.l1 {
        background: var(--heat-1);
      }
      .heat .c.l2 {
        background: var(--heat-2);
      }
      .heat .c.l3 {
        background: var(--heat-3);
      }
      .heat .c.off {
        background: transparent;
        border: 1px dashed var(--rule);
      }
      .heat .c.today {
        outline: 1.5px solid var(--ink);
        outline-offset: 1px;
      }
      .heat .day {
        font:
          500 9.5px/1 'JetBrains Mono',
          monospace;
        color: var(--faint);
        text-align: center;
      }

      /* Maintenant */
      .board {
        display: grid;
        grid-template-columns: minmax(290px, 340px) 1fr;
        gap: 16px;
      }
      .list {
        padding: 6px;
      }
      .group-title {
        padding: 12px 8px 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group-title .n {
        color: var(--faint);
      }
      .row {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        text-align: left;
        padding: 8px;
        border: 1px solid transparent;
        border-radius: 2px;
      }
      .row:hover {
        background: var(--sand);
      }
      .row[aria-selected='true'] {
        border-color: var(--ink);
        background: var(--paper);
        box-shadow: var(--shadow);
      }
      .row > div {
        min-width: 0;
      }
      .row .t {
        font-weight: 600;
        font-size: 13.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .s {
        color: var(--bark);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kind {
        width: 30px;
        height: 30px;
        border-radius: 2px;
        display: grid;
        place-items: center;
        background: var(--clay);
        color: var(--bark);
      }
      .kind.proposed {
        background: var(--info-surface);
        color: var(--info);
        border: 1px dashed var(--info);
      }
      .detail {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .subject {
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .subject-top {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .subject-top h2 {
        font-size: 18px;
      }
      .context {
        margin: 0;
        line-height: 1.6;
        max-width: 76ch;
      }
      .timeline {
        position: relative;
        height: 58px;
        margin: 6px 4px 0;
      }
      .track {
        position: absolute;
        left: 0;
        right: 0;
        top: 26px;
        height: 6px;
        background: var(--clay);
        border-radius: 1px;
      }
      .span {
        position: absolute;
        top: 26px;
        height: 6px;
        border-radius: 1px;
      }
      .span.past {
        background: var(--rule-strong);
      }
      .span.late {
        background: var(--ochre);
      }
      .span.ahead {
        background: repeating-linear-gradient(90deg, var(--info) 0 6px, transparent 6px 10px);
        opacity: 0.7;
      }
      .mark {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        white-space: nowrap;
      }
      .mark .lbl {
        font:
          500 10.5px/1.2 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--bark);
      }
      .mark .stem {
        width: 1.5px;
        height: 18px;
        background: var(--ink);
        margin-top: 3px;
      }
      .mark.below {
        top: 24px;
        flex-direction: column-reverse;
      }
      .mark.below .stem {
        margin: 0 0 3px;
        height: 14px;
      }
      .mark.now .lbl {
        color: var(--ink);
        font-weight: 600;
      }
      .mark.due .lbl {
        color: var(--primary);
        font-weight: 600;
      }
      .mark.due .stem {
        background: var(--primary);
      }
      .mark.edge-l {
        transform: none;
        align-items: flex-start;
      }
      .mark.edge-r {
        transform: translateX(-100%);
        align-items: flex-end;
      }
      .dayband {
        position: relative;
        margin: 10px 16px 0;
        height: 74px;
      }
      .hours {
        position: absolute;
        inset: 0;
        display: grid;
      }
      .hours span {
        border-left: 1px dotted var(--rule);
        font:
          500 10.5px/1 'JetBrains Mono',
          monospace;
        color: var(--faint);
        padding-left: 4px;
      }
      .block {
        position: absolute;
        top: 20px;
        height: 44px;
        border-radius: 2px;
        padding: 5px 7px;
        overflow: hidden;
        font-size: 12px;
        line-height: 1.25;
        border: 1px solid var(--rule-strong);
        background: var(--sand);
      }
      .block b {
        display: block;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .block small {
        font:
          10.5px 'JetBrains Mono',
          monospace;
        color: var(--bark);
        white-space: nowrap;
      }
      .block.event {
        background: var(--paper);
        border-color: var(--ink);
      }
      .block.proposed {
        background: var(--info-surface);
        border: 1px dashed var(--info);
        color: var(--info);
      }
      .block.proposed small {
        color: var(--info);
      }
      .block.focus {
        box-shadow: 0 0 0 2px var(--primary);
      }
      .now-line {
        position: absolute;
        top: 12px;
        bottom: 0;
        width: 1.5px;
        background: var(--primary);
      }
      .now-line::before {
        content: '';
        position: absolute;
        top: -4px;
        left: -3.5px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .choice {
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .choice.recommended {
        border: 1.5px solid var(--ink);
        box-shadow: var(--shadow);
      }
      .choice-head {
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 8px;
      }
      .choice-head h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .why {
        font:
          500 10.5px/1.3 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 3px 6px;
        border-radius: 2px;
        background: var(--info-surface);
        color: var(--info);
      }
      .choice p {
        margin: 0;
        color: var(--bark);
        font-size: 13px;
      }
      .checks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .checks li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .checks .i {
        margin-top: 2px;
        width: 15px;
        height: 15px;
      }
      .checks .good .i {
        color: var(--success);
      }
      .checks .warn {
        color: var(--verify);
      }
      .choice-foot {
        margin-top: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding-top: 6px;
      }
      .choice-foot .btn {
        flex: 1;
      }
      .empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--bark);
      }

      /* Routines */
      .template {
        list-style: none;
        margin: 0;
        padding: 6px 0;
      }
      .template li {
        display: grid;
        grid-template-columns: 92px 1fr auto;
        gap: 10px;
        padding: 7px 16px;
        align-items: center;
        font-size: 13px;
        border-left: 3px solid transparent;
      }
      .template li .h {
        font:
          500 12px 'JetBrains Mono',
          monospace;
        color: var(--faint);
      }
      .template li.past {
        color: var(--faint);
      }
      .template li.current {
        border-left-color: var(--primary);
        background: var(--sand);
        font-weight: 600;
      }
      .template li.current .h {
        color: var(--primary);
      }
      .check-row {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 9px 16px;
        border-bottom: 1px dotted var(--rule);
        width: 100%;
        text-align: left;
      }
      .check-row:last-child {
        border-bottom: 0;
      }
      .box {
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--rule-strong);
        border-radius: 2px;
        display: grid;
        place-items: center;
        background: var(--paper);
      }
      .box .i {
        width: 13px;
        height: 13px;
        stroke-width: 2.4;
        opacity: 0;
      }
      .check-row.done .box {
        background: var(--success);
        border-color: var(--success);
        color: #fffdf9;
      }
      .check-row.done .box .i {
        opacity: 1;
      }
      .check-row.done .t {
        color: var(--faint);
        text-decoration: line-through;
      }
      .check-row.off {
        opacity: 0.55;
      }
      .check-row .t {
        font-weight: 500;
      }
      .ring {
        --p: 50;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: conic-gradient(var(--success) calc(var(--p) * 1%), var(--clay) 0);
        display: grid;
        place-items: center;
        flex: none;
      }
      .ring span {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--paper);
        display: grid;
        place-items: center;
        font:
          600 13px 'JetBrains Mono',
          monospace;
      }

      /* Agenda */
      .week {
        display: grid;
        grid-template-columns: 44px repeat(7, minmax(0, 1fr));
        position: relative;
      }
      .week .wh {
        font:
          500 11px 'JetBrains Mono',
          monospace;
        color: var(--bark);
        text-align: center;
        padding: 8px 4px;
        border-bottom: 1px solid var(--rule);
      }
      .week .wh b {
        display: block;
        font:
          600 16px 'JetBrains Mono',
          monospace;
        color: var(--ink);
      }
      .week .wh.today b {
        color: var(--on-primary);
        background: var(--primary);
        border-radius: 2px;
        display: inline-block;
        padding: 0 6px;
      }
      .week .gutter {
        position: relative;
      }
      .week .gutter span {
        position: absolute;
        right: 6px;
        font:
          500 10px 'JetBrains Mono',
          monospace;
        color: var(--faint);
        transform: translateY(-50%);
      }
      .week .col {
        position: relative;
        border-left: 1px solid var(--rule);
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 39px,
          var(--rule) 39px 40px
        );
      }
      .week .col.today {
        background-color: var(--sand);
      }
      .week .ev {
        position: absolute;
        left: 3px;
        right: 3px;
        border-radius: 2px;
        padding: 3px 5px;
        font-size: 11.5px;
        line-height: 1.2;
        overflow: hidden;
        border: 1px solid var(--rule-strong);
        background: var(--paper);
      }
      .week .ev small {
        display: block;
        font:
          10px 'JetBrains Mono',
          monospace;
        color: var(--bark);
      }
      .week .ev.routine {
        background: var(--clay);
        border-color: transparent;
        color: var(--bark);
      }
      .week .ev.event {
        border-color: var(--ink);
      }
      .week .ev.due {
        border-color: var(--primary);
        background: var(--paper);
        color: var(--primary);
      }
      .week .ev.proposed {
        background: var(--info-surface);
        border: 1px dashed var(--info);
        color: var(--info);
      }
      .week .nowline {
        position: absolute;
        left: 0;
        right: 0;
        height: 1.5px;
        background: var(--primary);
        z-index: 2;
      }

      /* Files */
      .ficon {
        width: 32px;
        height: 38px;
        border: 1px solid var(--rule-strong);
        border-radius: 2px;
        display: grid;
        place-items: end center;
        font:
          600 8.5px/1 'JetBrains Mono',
          monospace;
        padding-bottom: 5px;
        background: var(--paper);
        flex: none;
        position: relative;
      }
      .ficon::before {
        content: '';
        position: absolute;
        top: -1px;
        right: -1px;
        width: 9px;
        height: 9px;
        background: linear-gradient(225deg, var(--paper) 50%, var(--rule-strong) 50%);
      }
      .ficon.pdf {
        color: var(--error);
      }
      .ficon.img {
        color: var(--info);
      }
      .ficon.csv {
        color: var(--success);
      }
      .ficon.md {
        color: var(--bark);
      }
      .fname {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
      }
      .preview {
        border: 1px solid var(--rule);
        background: var(--sand);
        border-radius: 2px;
        aspect-ratio: 3 / 4;
        display: flex;
        flex-direction: column;
        padding: 18px;
        gap: 8px;
        overflow: hidden;
      }
      .preview .ln {
        height: 7px;
        background: var(--rule);
        border-radius: 1px;
      }
      .preview.img {
        aspect-ratio: 4 / 3;
        background: linear-gradient(160deg, var(--clay), var(--rule-strong));
        align-items: center;
        justify-content: center;
        color: var(--bark);
      }
      dl.meta {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 6px 12px;
        margin: 0;
        font-size: 13px;
      }
      dl.meta dt {
        color: var(--faint);
        font:
          500 11px/1.8 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      dl.meta dd {
        margin: 0;
      }

      /* Models */
      .model-card {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px dotted var(--rule);
        text-decoration: none;
      }
      .model-card:hover {
        background: var(--sand);
      }
      .model-card:last-child {
        border-bottom: 0;
      }
      .nature {
        font:
          500 11.5px 'JetBrains Mono',
          monospace;
        padding: 2px 6px;
        border-radius: 2px;
        background: var(--clay);
        color: var(--ink);
        white-space: nowrap;
      }
      .nature.ref {
        background: var(--info-surface);
        color: var(--info);
      }
      .nature.calc {
        background: var(--success-surface);
        color: var(--success);
      }
      .radio {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        cursor: pointer;
        background: var(--paper);
      }
      .radio:has(input:checked) {
        border-color: var(--ink);
        box-shadow: var(--shadow);
      }
      .radio input {
        accent-color: var(--primary);
        margin-top: 3px;
      }
      .path {
        font:
          500 12.5px 'JetBrains Mono',
          monospace;
        background: var(--sand);
        border: 1px solid var(--rule);
        padding: 2px 6px;
        border-radius: 2px;
        overflow-wrap: anywhere;
      }
      .rule-line {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 16px;
        border-bottom: 1px dotted var(--rule);
        font-size: 13px;
      }
      .rule-line:last-child {
        border-bottom: 0;
      }
      .kw {
        font:
          600 11px 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        color: var(--primary);
        letter-spacing: 0.04em;
        margin-right: 4px;
      }

      /* Forms, drawer, toast */
      .form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        overflow-y: auto;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font:
          500 11px 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--bark);
        display: flex;
        justify-content: space-between;
      }
      .field label small {
        text-transform: none;
        letter-spacing: 0;
        color: var(--faint);
      }
      .field input,
      .field select {
        padding: 8px 10px;
        border: 1px solid var(--rule-strong);
        border-radius: 2px;
        background: var(--paper);
        width: 100%;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .warnbox {
        padding: 10px 12px;
        border: 1px solid var(--verify);
        background: var(--verify-surface);
        color: var(--verify);
        border-radius: 2px;
        font-size: 13px;
        display: none;
      }
      .warnbox.show {
        display: block;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(23, 16, 12, 0.32);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 20;
      }
      .scrim.open {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: min(420px, calc(100vw - 24px));
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        box-shadow: var(--shadow);
        z-index: 21;
        transform: translateX(calc(100% + 24px));
        transition: transform 0.25s ease;
        display: flex;
        flex-direction: column;
      }
      .drawer.open {
        transform: none;
      }
      .drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;

      function regularity() {
        const days = 28,
          todayIdx = 27;
        const seed = (s) => {
          let x = 0;
          for (const c of s) x = (x * 31 + c.charCodeAt(0)) % 9973;
          return x;
        };
        const cell = (h, d) => {
          const dow = (d + 4) % 7; // day 0 = Saturday 3 Oct… keeps the pattern stable
          const off =
            (h.cad === 'lun–ven' && (dow === 0 || dow === 1)) ||
            (h.cad.startsWith('mar') && ![3, 4, 0].includes(dow));
          if (off) return 'off';
          if (d > todayIdx) return '';
          if (d === todayIdx)
            return state.checks[h.id] === 'done'
              ? 'l3'
              : state.checks[h.id] === 'partial'
                ? 'l1'
                : '';
          const r = seed(h.id + d) % 100;
          return r < h.rate - 15 ? 'l3' : r < h.rate ? 'l2' : r < h.rate + 10 ? 'l1' : '';
        };
        const cols = `150px repeat(${days}, minmax(8px, 1fr))`;
        const daynums = Array.from({ length: days }, (_, i) => {
          const n = i + 3;
          return n <= 31 ? n : n - 31;
        });
        const heat = `<div class="pad scroll"><div class="heat" style="grid-template-columns:${cols};min-width:560px"><span></span>${daynums.map((n, i) => `<span class="day">${i % 3 === 0 || i === todayIdx ? n : ''}</span>`).join('')}
    ${HABITS.map((h) => `<span class="lbl">${h.name}</span>${Array.from({ length: days }, (_, d) => `<span class="c ${cell(h, d)} ${d === todayIdx ? 'today' : ''}" title="${h.name} · ${daynums[d]}"></span>`).join('')}`).join('')}</div>
    <div class="legend" style="margin-top:12px"><span><i style="background:var(--heat-3)"></i>Fait à l’heure</span><span><i style="background:var(--heat-2)"></i>Fait</span><span><i style="background:var(--heat-1)"></i>En partie</span><span><i style="background:var(--heat-0)"></i>Manqué</span><span><i style="border:1px dashed var(--rule-strong)"></i>Pas prévu</span></div></div>`;
        const pts = [
          62, 70, 68, 75, 71, 79, 82, 77, 74, 80, 83, 78, 81, 85, 79, 82, 84, 80, 76, 82, 86, 83,
          81, 85, 79, 84, 88, 82,
        ];
        const W = 520,
          H = 150,
          x = (i) => 28 + (i / (pts.length - 1)) * (W - 36),
          y = (v) => H - 20 - ((v - 50) / 50) * (H - 34);
        const line = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Taux quotidien sur 28 jours">${[50, 75, 100].map((v) => `<line x1="28" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-dasharray="2 3"/><text x="22" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('')}
    <path d="M${pts.map((v, i) => `${x(i)},${y(v)}`).join(' L')}" fill="none" stroke="var(--success)" stroke-width="2"/><circle cx="${x(pts.length - 1)}" cy="${y(pts.at(-1))}" r="3.5" fill="var(--success)"/>
    <text x="${x(0)}" y="${H - 4}">3 oct.</text><text x="${x(pts.length - 1)}" y="${H - 4}" text-anchor="end">30 oct.</text></svg>`;
        return (
          panel(
            '28 derniers jours',
            heat,
            '<span class="muted" style="font-size:12px">tiré des exécutions notées</span>',
            'i-routine',
          ) +
          `<div class="grid g2">${panel('Taux quotidien des non-négociables', `<div class="pad">${line}</div>`, '<span class="muted mono" style="font-size:12px">%</span>', 'i-chart')}
    ${panel(
      'Ce qui glisse',
      `<div>${HABITS.filter((h) => h.rate < 70)
        .map(
          (h) =>
            `<div class="rule-line"><span class="tag ${h.rate < 50 ? 'error' : 'late'}">${h.rate}%</span><span><b>${h.name}</b><div class="cell-sub">${h.id === 'coucher' ? 'manqué surtout le lundi et le jeudi (soirées longues)' : h.id === 'verset' ? 'sans horaire fixe : à placer dans le gabarit ?' : 'glisse quand le bloc de 14:00 commence par l’admin'}</div></span></div>`,
        )
        .join('')}</div>`,
      '<span class="origin inferred">déduit</span>',
      'i-alert',
    )}</div>`
        );
      }

      }
      window.addEventListener('hashchange', () => go(location.hash.slice(1)));

      document.addEventListener('click', (e) => {
        const t = e.target.closest('button, a, tr[data-file], tr[data-routine]');
        if (!t) {
          $('me-menu').classList.remove('open');
          return;
        }
        const d = t.dataset;
        if (d.filter) {
          state.filter = d.filter;
          render();
        } else if (d.pick) {
          state.selected = d.pick;
          state.reading = true;
          render();
        } else if ('back' in d) {
          state.reading = false;
          render();
        } else if (d.act) {
          const [id, ci, ai] = d.act.split(':');
          const it = NOWITEMS.find((x) => x.id === id);
          state.done.add(id);
          state.reading = false;
          render();
          log(it.choices[ci].actions[ai][2], () => {
            state.done.delete(id);
            state.selected = id;
          });
        } else if (d.ibpick) {
          state.ibSel = d.ibpick;
          state.reading = true;
          render();
        } else if (d.ib) {
          const [id, ci, ai] = d.ib.split(':');
          const it = INBOX.find((x) => x.id === id);
          const text = it.choices[ci].actions[ai][2];
          if (text === 'form') {
            moveDrawer();
            return;
          }
          state.ibDone.add(id);
          state.reading = false;
          render();
          log(text, () => state.ibDone.delete(id));
        } else if (d.ag) {
          state.agView = d.ag;
          render();
        } else if (d.rv) {
          state.revue = d.rv;
          render();
        } else if ('sure' in d) {
          const sure = INBOX.filter((x) => x.sure && !state.ibDone.has(x.id));
          sure.forEach((x) => state.ibDone.add(x.id));
          state.reading = false;
          render();
          log(`${sure.length} éléments rangés ; ${INBOX.filter((x) => !state.ibDone.has(x.id)).length} gardent une question`, () => sure.forEach((x) => state.ibDone.delete(x.id)));
        } else if ('rules' in d) {
          openDrawer(`<div class="drawer-head"><div><h2>Règles par source</h2><span class="muted" style="font-size:12px">ce qui est rangé tout de suite, et ce qui attend</span></div><button class="icon-btn" data-close aria-label="Fermer">${icon('i-x')}</button></div>
  <div class="scroll"><table><thead><tr><th>Source</th><th>Par défaut</th><th>Exception</th></tr></thead><tbody>
    <tr><td><b>Telegram, WhatsApp</b></td><td><span class="tag plain">à ranger</span></td><td class="cell-sub">« les dépenses avec un montant et un compte : ranger directement »</td></tr>
    <tr><td><b>E-mails</b></td><td><span class="tag plain">à ranger</span></td><td class="cell-sub">« factures d’un fournisseur connu : rattacher directement »</td></tr>
    <tr><td><b>Claude, ChatGPT</b></td><td><span class="tag ok">rangé, avec confirmation</span></td><td class="cell-sub">« mets ça dans l’inbox » le garde sans le classer</td></tr>
    <tr><td><b>Fichiers et relevés</b></td><td><span class="tag plain">à ranger</span></td><td class="cell-sub">—</td></tr></tbody></table></div>
  <div class="pad"><div class="hint">${icon('i-lock')}<span>Le pré-tri par règles n’utilise <em>aucune IA</em> : tes hashtags (#depense, #soir), les mots déclarés par tes apps, un montant suivi d’un compte.</span></div></div>
  <div class="drawer-foot"><button class="btn" data-close>Fermer</button><button class="btn solid">${icon('i-plus')}Ajouter une règle</button></div>`);
          return;
        } else if (d.routine) {
          routineDrawer(Number(d.routine));
          return;
        } else if ('want' in d) {
          wantDrawer();
          return;
        } else if ('installWant' in d) {
          closeAll();
          log('App « Médicaments » installée : 2 types, 3 pages, 1 règle', () => {});
        } else if (d.pin) {
          state.pinned[d.pin] = !state.pinned[d.pin];
          const routeOf = { Finances: 'finances', Routines: 'routines' };
          NAV.find(([title]) => title === 'Apps')[1] = Object.keys(state.pinned)
            .filter((a) => state.pinned[a])
            .map((a) => [routeOf[a] || 'apps', a, APPS[a][1], null, false, APPS[a][0]])
            .concat([['apps', 'Toutes les apps', 'i-plus', () => 6, false, null, true]]);
          render();
          log(state.pinned[d.pin] ? `${d.pin} épinglée dans la barre` : `${d.pin} retirée de la barre`);
        } else if (d.who) {
          state.who = d.who;
          render();
        } else if (d.take) {
          const sp = state.route.split('/')[1];
          const task = SHARED[sp].tasks.find((x) => x[0] === d.take);
          task[1] = 'JC';
          render();
          log(`« ${task[0]} » : tu le prends`, () => (task[1] = ''));
        } else if ('balance' in d) {
          log('Équilibrage proposé à Sara : 7 500 F');
        } else if ('note' in d) {
          noteDrawer();
          return;
        } else if ('openSide' in d) {
          $('side').classList.add('open');
          $('scrim').classList.add('open');
          return;
        } else if ('tech' in d) {
          state.tech = !state.tech;
          render();
        } else if (d.person) {
          state.person = d.person;
          state.reading = true;
          render();
        } else if (d.occ) {
          const [k, s] = d.occ.split(':');
          const before = state.occ[k];
          state.occ[k] = before === s ? '' : s;
          render();
          log(`${k} : ${{ done: 'fait', miss: 'manqué', moved: 'reporté' }[s]} aujourd’hui`, () => (state.occ[k] = before));
        } else if (d.fsrc) {
          state.fsrc = d.fsrc;
          render();
        } else if (d.step) {
          const n = state.step + Number(d.step);
          if (n > 4) {
            state.step = 0;
            go('maintenant');
            return;
          }
          state.step = Math.max(0, n);
          render();
        } else if ('saveRevue' in d) {
          log('Revue de la semaine 45 enregistrée · 2 actions créées');
        } else if (d.sp) {
          state.spaces[d.sp] = !state.spaces[d.sp];
          render();
        } else if (d.grp) {
          state.grp = d.grp;
          render();
        } else if (t.id === 'mcp-add') {
          const u = $('mcp-url').value.trim();
          if (!/^https:\/\/\S+$/.test(u)) {
            $('mcp-url').focus();
            $('toast-text').textContent = 'Entre une adresse qui commence par https://';
            $('toast-undo').style.display = 'none';
            $('toast').classList.add('show');
            return;
          }
          state.mcp.push(u);
          render();
          log(`Serveur MCP ajouté : ${u}`, () => state.mcp.pop());
        } else if (t.id === 'cap-save' || t.id === 'cap-box') {
          const title = $('cap-title').value || 'Note';
          if (t.id === 'cap-box') {
            const item = { id: 'cap' + Date.now(), src: 'Noté ici', icon: 'i-plus', kind: $('cap-kind').value, space: 'J-C', raw: `« ${esc(title)} »`, tag: ['neutral', 'à ranger'], context: 'Noté depuis la barre de recherche <span class="origin said">dit</span>.', fields: [['Type', $('cap-kind').value, 'inferred']], choices: [{ rec: true, title: 'Enregistrer', text: 'Entre dans ta vie tel quel.', checks: [['good', 'Annulable']], actions: [['solid', 'Enregistrer', title + ' enregistré']] }] };
            INBOX.unshift(item);
            closeAll();
            render();
            log(`${title} : mis à ranger`, () => INBOX.splice(INBOX.indexOf(item), 1));
          } else {
            closeAll();
            log(`${$('cap-kind').value} « ${title} » enregistré`);
          }
          $('search').value = '';
        } else if (d.mf) {
          state.moveFilter = d.mf;
          if (t.tagName === 'A') {
            e.preventDefault();
            go('finances/mouvements');
            return;
          }
          render();
        } else if (d.ff) {
          state.fileFilter = d.ff;
          render();
        } else if (d.check) {
          const h = d.check,
            before = state.checks[h];
          state.checks[h] = before === 'done' ? 'todo' : 'done';
          render();
          const name = HABITS.find((x) => x.id === h).name;
          log(state.checks[h] === 'done' ? `${name} : fait à 10:41` : `${name} : décoché`, () => {
            state.checks[h] = before;
          });
        } else if ('addMove' in d) {
          e.preventDefault();
          moveDrawer();
        } else if (t.id === 'm-save') {
          const amt = Number($('m-amt').value.replace(/\D/g, '')) * Number($('m-nat').value);
          const fund = $('m-fund').value,
            acc = $('m-acc').value || null;
          const mv = {
            d: '30 oct.',
            h: '10:41',
            label: $('m-label').value || 'Mouvement',
            cat: $('m-cat').value,
            acc,
            fund,
            amt,
            st: acc ? 'confirmé' : 'à réconcilier',
            o: 'said',
            fresh: true,
            note: acc ? '' : 'compte à préciser',
          };
          MOVES.unshift(mv);
          go('finances/mouvements');
          log(`${mv.label}, ${money(amt, 'XOF', true)} noté`, () => {
            MOVES = MOVES.filter((m) => m !== mv);
          });
          mv.fresh = false;
        } else if (d.dl) {
          e.stopPropagation();
          download(d.dl);
          log(`${d.dl} téléchargé`);
        } else if (d.file) {
          fileDrawer(d.file);
        } else if (d.undo) {
          undo(Number(d.undo));
        } else if (t.id === 'toast-undo') {
          undo(state.toastUndo);
        } else if ('close' in d) {
          closeAll();
        } else if (t.id === 'open-journal') {
          journalDrawer();
        } else if (t.id === 'open-side') {
          $('side').classList.add('open');
          $('scrim').classList.add('open');
          return;
        } else if (t.id === 'me') {
          $('me-menu').classList.toggle('open');
          return;
        } else if (d.go) {
          go(d.go);
        } else if (t.id === 'theme') {
          const r = document.documentElement;
          const dark = r.dataset.theme
            ? r.dataset.theme === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          r.dataset.theme = dark ? 'light' : 'dark';
        } else if (
          t.tagName === 'A' &&
          (t.getAttribute('href') || '').startsWith('#') &&
          t.getAttribute('href').length > 1
        ) {
          e.preventDefault();
          go(t.getAttribute('href').slice(1));
        }
        if (t.getAttribute && t.getAttribute('href') === '#') e.preventDefault();
        $('me-menu').classList.remove('open');
      });
      document.addEventListener('change', (e) => {
        if (e.target.name === 'rg') {
          state.rangement = e.target.value;
          render();
        }
      });
      $('scrim').addEventListener('click', closeAll);
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          $('search').focus();
        }
        if (e.key === 'Escape') closeAll();
        if (e.key === 'Enter' && e.target.id === 'search' && e.target.value.trim()) {
          e.preventDefault();
          const q = e.target.value.trim();
          if (/\?$|^(combien|quand|qui|où|quel|quelle)\b/i.test(q)) answerDrawer(q);
          else captureDrawer(q);
        }
      });
      state.route = location.hash.slice(1) || 'maintenant';
      render();
    </script>
