<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis — maquette</title>
    <!--
  Maquette de la plateforme (proposition, pas encore le produit). Données fictives : ce dépôt est public.
  Ce qu'elle montre :
  - « Maintenant » : ce qui compte, trié par urgence, avec les choix préparés ;
  - deux apps construites avec Claude, sans code : Finances (comptes, fonds protégés, obligations,
    rapprochement — la structure du Life OS) et Routines (habitudes, gabarit de journée, régularité) ;
  - les tableaux de bord, l'agenda, les fichiers, et les modèles de type (champs, relations, calculs,
    règles, rangement à l'export — configurables).
  Les textes sont écrits en dur ici ; dans l'app, ils viendront du catalogue de mots.
-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --canvas: #efe6dc;
        --paper: #fffdf9;
        --sand: #fbf6f0;
        --clay: #f4e6da;
        --rule: #e6d6c8;
        --rule-strong: #c9b3a4;
        --ink: #2a1610;
        --bark: #6b4e43;
        --faint: #9a8276;
        --primary: #b83a1b;
        --primary-strong: #962e14;
        --ochre: #c98a2b;
        --on-primary: #fffdf9;
        --on-ink: #fffdf9;
        --success: #2f7d4f;
        --success-surface: #e3f1e8;
        --verify: #7a4a0b;
        --verify-surface: #fbebd0;
        --error: #9b1c3c;
        --error-surface: #f7e1e7;
        --info: #2b5c8a;
        --info-surface: #e2ecf5;
        --heat-0: #f1e7dd;
        --heat-1: #d6e6da;
        --heat-2: #9cc7a9;
        --heat-3: #2f7d4f;
        --shadow: 0 1px 2px rgba(42, 22, 16, 0.06), 0 4px 16px rgba(42, 22, 16, 0.05);
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --canvas: #0f0a07;
        --paper: #17100c;
        --sand: #1d140f;
        --clay: #2c2019;
        --rule: #3a2b23;
        --rule-strong: #5e4a3e;
        --ink: #f4e6da;
        --bark: #bfa799;
        --faint: #8c7568;
        --primary: #f08a63;
        --primary-strong: #e2572d;
        --ochre: #d9a04a;
        --on-primary: #17100c;
        --on-ink: #17100c;
        --success: #4fa873;
        --success-surface: #1c3025;
        --verify: #f2cc8a;
        --verify-surface: #3a2a12;
        --error: #d0546f;
        --error-surface: #3e1620;
        --info: #5c8fc2;
        --info-surface: #172a3d;
        --heat-0: #251b15;
        --heat-1: #1f3a2a;
        --heat-2: #2e6544;
        --heat-3: #4fa873;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --canvas: #0f0a07;
          --paper: #17100c;
          --sand: #1d140f;
          --clay: #2c2019;
          --rule: #3a2b23;
          --rule-strong: #5e4a3e;
          --ink: #f4e6da;
          --bark: #bfa799;
          --faint: #8c7568;
          --primary: #f08a63;
          --primary-strong: #e2572d;
          --ochre: #d9a04a;
          --on-primary: #17100c;
          --on-ink: #17100c;
          --success: #4fa873;
          --success-surface: #1c3025;
          --verify: #f2cc8a;
          --verify-surface: #3a2a12;
          --error: #d0546f;
          --error-surface: #3e1620;
          --info: #5c8fc2;
          --info-surface: #172a3d;
          --heat-0: #251b15;
          --heat-1: #1f3a2a;
          --heat-2: #2e6544;
          --heat-3: #4fa873;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--canvas);
        color: var(--ink);
        font:
          400 14px/1.5 'Instrument Sans',
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      h1,
      h2,
      h3 {
        font-family: Archivo, system-ui, sans-serif;
        margin: 0;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 15px;
        font-weight: 600;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .caps {
        font:
          500 11px/1.4 'JetBrains Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--bark);
      }
      .muted {
        color: var(--bark);
      }
      .faint {
        color: var(--faint);
      }
      .pos {
        color: var(--success);
      }
      .neg {
        color: var(--error);
      }

      /* Shell */
      .app {
        display: grid;
        grid-template-columns: 252px 1fr;
        height: 100vh;
        padding: 12px;
      }
      aside.side {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 4px 12px 4px 4px;
        min-height: 0;
        overflow-y: auto;
      }
      main {
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .switcher,
      .me {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        width: 100%;
        text-align: left;
      }
      .logo {
        width: 30px;
        height: 30px;
        border-radius: 2px;
        background: var(--primary);
        color: var(--on-primary);
        display: grid;
        place-items: center;
        font:
          700 15px/1 Archivo,
          sans-serif;
        flex: none;
      }
      .switcher b,
      .me b {
        display: block;
        font:
          600 14px/1.2 Archivo,
          sans-serif;
      }
      .me b {
        font:
          600 13px/1.2 'Instrument Sans',
          sans-serif;
      }
      .switcher small,
      .me small {
        color: var(--bark);
        font-size: 12px;
      }
      .switcher > .i,
      .me > .i {
        margin-left: auto;
        color: var(--faint);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        background: var(--paper);
        color: var(--faint);
      }
      .search input {
        border: 0;
        outline: 0;
        background: none;
        flex: 1;
        min-width: 0;
        color: var(--ink);
      }
      .kbd {
        font:
          500 11px/1 'JetBrains Mono',
          monospace;
        border: 1px solid var(--rule);
        border-radius: 2px;
        padding: 3px 5px;
        color: var(--bark);
      }
      .nav-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-group > .caps {
        padding: 6px 8px 4px;
        color: var(--faint);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-radius: 2px;
        border: 1px solid transparent;
        width: 100%;
        text-align: left;
        text-decoration: none;
      }
      .nav-item:hover {
        background: rgba(255, 253, 249, 0.55);
      }
      .nav-item[aria-current='page'] {
        background: var(--paper);
        border-color: var(--rule);
        box-shadow: var(--shadow);
        font-weight: 600;
      }
      .nav-item .count {
        margin-left: auto;
        font:
          500 11px/1 'JetBrains Mono',
          monospace;
        color: var(--faint);
      }
      .nav-item .count.hot {
        background: var(--primary);
        color: var(--on-primary);
        padding: 3px 6px;
        border-radius: 2px;
      }
      .app-icon {
        width: 20px;
        height: 20px;
        border-radius: 2px;
        display: grid;
        place-items: center;
        flex: none;
        color: #fffdf9;
      }
      .app-icon .i {
        width: 13px;
        height: 13px;
      }
      .nav-item.ghost {
        color: var(--faint);
        border: 1px dashed var(--rule-strong);
      }
      .space-dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: none;
        margin: 0 6px;
      }
      .grow {
        flex: 1;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
        font:
          600 12px/1 Archivo,
          sans-serif;
        background: var(--clay);
      }
      .menu {
        display: none;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        box-shadow: var(--shadow);
        padding: 4px;
      }
      .menu.open {
        display: block;
      }
      .menu button {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: 8px;
        border-radius: 2px;
        text-align: left;
      }
      .menu button:hover {
        background: var(--sand);
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--bark);
        font-size: 13px;
        min-width: 0;
      }
      .crumbs b {
        color: var(--ink);
        font-weight: 600;
        white-space: nowrap;
      }
      .chip-now {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--sand);
        white-space: nowrap;
      }
      .live {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 3px var(--success-surface);
        flex: none;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid var(--rule);
        border-radius: 2px;
        position: relative;
        background: var(--paper);
        flex: none;
      }
      .icon-btn:hover {
        background: var(--sand);
      }
      .icon-btn .pip {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--primary);
        border: 1.5px solid var(--paper);
      }
      .only-mobile {
        display: none;
      }

      /* Page */
      .page {
        padding: 20px 24px 28px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .page-head h1 {
        font-size: 24px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page-head h1 .app-icon {
        width: 28px;
        height: 28px;
      }
      .page-head h1 .app-icon .i {
        width: 16px;
        height: 16px;
      }
      .page-head p {
        margin: 2px 0 0;
        color: var(--bark);
        font-size: 13px;
      }
      .head-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .built {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font:
          500 11px/1.4 'JetBrains Mono',
          monospace;
        color: var(--info);
        background: var(--info-surface);
        padding: 2px 7px;
        border-radius: 2px;
        margin-left: 4px;
        vertical-align: 3px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--rule);
        overflow-x: auto;
        margin-top: -4px;
      }
      .tabs a {
        padding: 8px 12px;
        text-decoration: none;
        color: var(--bark);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
        font-size: 13.5px;
      }
      .tabs a[aria-current='page'] {
        color: var(--ink);
        border-color: var(--primary);
        font-weight: 600;
      }
      .tabs a .n {
        font:
          500 11px/1 'JetBrains Mono',
          monospace;
        color: var(--faint);
        margin-left: 4px;
      }
      .segmented {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        background: var(--sand);
        border: 1px solid var(--rule);
        border-radius: 2px;
        max-width: 100%;
        overflow-x: auto;
      }
      .segmented button {
        padding: 5px 10px;
        border-radius: 2px;
        color: var(--bark);
        font-size: 13px;
        white-space: nowrap;
      }
      .segmented button[aria-pressed='true'] {
        background: var(--paper);
        color: var(--ink);
        font-weight: 600;
        box-shadow: var(--shadow);
      }
      .segmented .n {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        margin-left: 4px;
        color: var(--faint);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 2px;
        border: 1px solid var(--rule-strong);
        background: var(--paper);
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--sand);
      }
      .btn.solid {
        background: var(--ink);
        color: var(--on-ink);
        border-color: var(--ink);
      }
      .btn.solid:hover {
        background: var(--primary-strong);
        border-color: var(--primary-strong);
        color: #fffdf9;
      }
      .btn.small {
        padding: 5px 9px;
        font-size: 12.5px;
      }
      .btn.wide {
        width: 100%;
      }

      .grid {
        display: grid;
        gap: 16px;
      }
      .g4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g21 {
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      }
      .g12 {
        grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
      }
      .span2 {
        grid-column: span 2;
      }
      .panel {
        background: var(--sand);
        border: 1px solid var(--rule);
        border-radius: 2px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px;
        min-height: 40px;
      }
      .panel-head .left {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--bark);
        min-width: 0;
      }
      .panel-body {
        background: var(--paper);
        border-top: 1px solid var(--rule);
        flex: 1;
        min-width: 0;
      }
      .pad {
        padding: 14px 16px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--rule);
        background: var(--paper);
        white-space: nowrap;
      }
      .kpi {
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        padding: 12px 14px;
        min-width: 0;
      }
      .kpi .v {
        font:
          600 26px/1.15 'JetBrains Mono',
          monospace;
        letter-spacing: -0.02em;
        margin-top: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kpi .v small {
        font-size: 13px;
        font-weight: 500;
        color: var(--bark);
        margin-left: 4px;
      }
      .kpi .s {
        color: var(--bark);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .kpi.alert {
        border-color: var(--verify);
        background: var(--verify-surface);
      }
      .kpi.alert .v,
      .kpi.alert .caps {
        color: var(--verify);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 7px;
        border-radius: 2px;
        font:
          500 11.5px/1.4 'JetBrains Mono',
          monospace;
        white-space: nowrap;
      }
      .tag::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .tag.error {
        background: var(--error-surface);
        color: var(--error);
      }
      .tag.late {
        background: var(--verify-surface);
        color: var(--verify);
      }
      .tag.info {
        background: var(--info-surface);
        color: var(--info);
      }
      .tag.ok {
        background: var(--success-surface);
        color: var(--success);
      }
      .tag.neutral {
        background: var(--clay);
        color: var(--bark);
      }
      .tag.plain {
        color: var(--bark);
        padding-left: 0;
      }
      .tag.plain::before,
      .tag.bare::before {
        display: none;
      }
      .origin {
        font:
          500 10.5px/1 'JetBrains Mono',
          monospace;
        padding: 2px 5px;
        border-radius: 2px;
        vertical-align: 1px;
        margin-left: 2px;
      }
      .origin.said {
        background: var(--success-surface);
        color: var(--success);
      }
      .origin.read {
        background: var(--verify-surface);
        color: var(--verify);
      }
      .origin.inferred {
        background: var(--info-surface);
        color: var(--info);
      }
      .quote {
        background: var(--success-surface);
        color: var(--success);
        padding: 0 4px;
        border-radius: 2px;
      }
      .lock {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font:
          500 11px/1.4 'JetBrains Mono',
          monospace;
        color: var(--bark);
      }
      .lock .i {
        width: 12px;
        height: 12px;
      }

      /* Tables */
      .scroll {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font:
          500 10.5px/1.4 'JetBrains Mono',
          monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 8px 10px;
        border-bottom: 1px solid var(--rule);
        white-space: nowrap;
        background: var(--paper);
      }
      td {
        padding: 9px 10px;
        border-bottom: 1px dotted var(--rule);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.n,
      th.n {
        text-align: right;
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      tr.group td {
        background: var(--sand);
        font:
          500 11px/1.4 'JetBrains Mono',
          monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--bark);
        padding: 6px 10px;
        border-bottom: 1px solid var(--rule);
      }
      tr.total td {
        border-top: 1px solid var(--rule-strong);
        font-weight: 600;
        background: var(--sand);
      }
      tbody tr.row-click {
        cursor: pointer;
      }
      tbody tr.row-click:hover td {
        background: var(--sand);
      }
      tr.flash td {
        animation: flash 1.6s ease;
      }
      @keyframes flash {
        from {
          background: var(--success-surface);
        }
        to {
          background: transparent;
        }
      }
      .cell-title {
        font-weight: 600;
      }
      .cell-sub {
        color: var(--bark);
        font-size: 12px;
      }
      .bar {
        height: 6px;
        background: var(--clay);
        border-radius: 1px;
        position: relative;
        overflow: hidden;
        min-width: 60px;
      }
      .bar > i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--ink);
        border-radius: 1px;
      }
      .bar.ok > i {
        background: var(--success);
      }
      .bar.warn > i {
        background: var(--ochre);
      }
      .bar.info > i {
        background: var(--info);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        font-size: 12.5px;
        background: var(--paper);
        text-decoration: none;
        white-space: nowrap;
      }
      .chip small {
        color: var(--faint);
        font:
          500 11px 'JetBrains Mono',
          monospace;
      }
      .chip[aria-pressed='true'] {
        border-color: var(--ink);
        font-weight: 600;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .banner {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        border: 1px solid var(--verify);
        background: var(--verify-surface);
        color: var(--verify);
        border-radius: 2px;
        flex-wrap: wrap;
      }
      .banner b {
        color: var(--ink);
      }
      .banner .btn {
        margin-left: auto;
      }
      .hint {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 14px;
        border: 1px dashed var(--info);
        background: var(--info-surface);
        color: var(--info);
        border-radius: 2px;
        font-size: 13px;
      }
      .hint em {
        font-style: normal;
        color: var(--ink);
      }

      /* Charts */
      .chart {
        width: 100%;
        height: auto;
        display: block;
      }
      .chart text {
        fill: var(--faint);
        font:
          500 10.5px 'JetBrains Mono',
          monospace;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--bark);
        font-size: 12px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .hbar {
        display: grid;
        grid-template-columns: 110px 1fr 92px;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
        font-size: 13px;
      }
      .hbar .track {
        position: relative;
        height: 10px;
        background: var(--clay);
        border-radius: 1px;
      }
      .hbar .fill {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--ink);
        border-radius: 1px;
      }
      .hbar .fill.over {
        background: var(--error);
      }
      .hbar .budget {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        background: var(--primary);
      }
      .heat {
        display: grid;
        gap: 3px;
        align-items: center;
      }
      .heat .lbl {
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 8px;
      }
      .heat .c {
        aspect-ratio: 1;
        border-radius: 2px;
        background: var(--heat-0);
        min-width: 8px;
      }
      .heat .c.l1 {
        background: var(--heat-1);
      }
      .heat .c.l2 {
        background: var(--heat-2);
      }
      .heat .c.l3 {
        background: var(--heat-3);
      }
      .heat .c.off {
        background: transparent;
        border: 1px dashed var(--rule);
      }
      .heat .c.today {
        outline: 1.5px solid var(--ink);
        outline-offset: 1px;
      }
      .heat .day {
        font:
          500 9.5px/1 'JetBrains Mono',
          monospace;
        color: var(--faint);
        text-align: center;
      }

      /* Maintenant */
      .board {
        display: grid;
        grid-template-columns: minmax(290px, 340px) 1fr;
        gap: 16px;
      }
      .list {
        padding: 6px;
      }
      .group-title {
        padding: 12px 8px 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group-title .n {
        color: var(--faint);
      }
      .row {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        text-align: left;
        padding: 8px;
        border: 1px solid transparent;
        border-radius: 2px;
      }
      .row:hover {
        background: var(--sand);
      }
      .row[aria-selected='true'] {
        border-color: var(--ink);
        background: var(--paper);
        box-shadow: var(--shadow);
      }
      .row > div {
        min-width: 0;
      }
      .row .t {
        font-weight: 600;
        font-size: 13.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .s {
        color: var(--bark);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kind {
        width: 30px;
        height: 30px;
        border-radius: 2px;
        display: grid;
        place-items: center;
        background: var(--clay);
        color: var(--bark);
      }
      .kind.proposed {
        background: var(--info-surface);
        color: var(--info);
        border: 1px dashed var(--info);
      }
      .detail {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .subject {
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .subject-top {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .subject-top h2 {
        font-size: 18px;
      }
      .context {
        margin: 0;
        line-height: 1.6;
        max-width: 76ch;
      }
      .timeline {
        position: relative;
        height: 58px;
        margin: 6px 4px 0;
      }
      .track {
        position: absolute;
        left: 0;
        right: 0;
        top: 26px;
        height: 6px;
        background: var(--clay);
        border-radius: 1px;
      }
      .span {
        position: absolute;
        top: 26px;
        height: 6px;
        border-radius: 1px;
      }
      .span.past {
        background: var(--rule-strong);
      }
      .span.late {
        background: var(--ochre);
      }
      .span.ahead {
        background: repeating-linear-gradient(90deg, var(--info) 0 6px, transparent 6px 10px);
        opacity: 0.7;
      }
      .mark {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        white-space: nowrap;
      }
      .mark .lbl {
        font:
          500 10.5px/1.2 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--bark);
      }
      .mark .stem {
        width: 1.5px;
        height: 18px;
        background: var(--ink);
        margin-top: 3px;
      }
      .mark.below {
        top: 24px;
        flex-direction: column-reverse;
      }
      .mark.below .stem {
        margin: 0 0 3px;
        height: 14px;
      }
      .mark.now .lbl {
        color: var(--ink);
        font-weight: 600;
      }
      .mark.due .lbl {
        color: var(--primary);
        font-weight: 600;
      }
      .mark.due .stem {
        background: var(--primary);
      }
      .mark.edge-l {
        transform: none;
        align-items: flex-start;
      }
      .mark.edge-r {
        transform: translateX(-100%);
        align-items: flex-end;
      }
      .dayband {
        position: relative;
        margin: 10px 16px 0;
        height: 74px;
      }
      .hours {
        position: absolute;
        inset: 0;
        display: grid;
      }
      .hours span {
        border-left: 1px dotted var(--rule);
        font:
          500 10.5px/1 'JetBrains Mono',
          monospace;
        color: var(--faint);
        padding-left: 4px;
      }
      .block {
        position: absolute;
        top: 20px;
        height: 44px;
        border-radius: 2px;
        padding: 5px 7px;
        overflow: hidden;
        font-size: 12px;
        line-height: 1.25;
        border: 1px solid var(--rule-strong);
        background: var(--sand);
      }
      .block b {
        display: block;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .block small {
        font:
          10.5px 'JetBrains Mono',
          monospace;
        color: var(--bark);
        white-space: nowrap;
      }
      .block.event {
        background: var(--paper);
        border-color: var(--ink);
      }
      .block.proposed {
        background: var(--info-surface);
        border: 1px dashed var(--info);
        color: var(--info);
      }
      .block.proposed small {
        color: var(--info);
      }
      .block.focus {
        box-shadow: 0 0 0 2px var(--primary);
      }
      .now-line {
        position: absolute;
        top: 12px;
        bottom: 0;
        width: 1.5px;
        background: var(--primary);
      }
      .now-line::before {
        content: '';
        position: absolute;
        top: -4px;
        left: -3.5px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .choice {
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .choice.recommended {
        border: 1.5px solid var(--ink);
        box-shadow: var(--shadow);
      }
      .choice-head {
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 8px;
      }
      .choice-head h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .why {
        font:
          500 10.5px/1.3 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 3px 6px;
        border-radius: 2px;
        background: var(--info-surface);
        color: var(--info);
      }
      .choice p {
        margin: 0;
        color: var(--bark);
        font-size: 13px;
      }
      .checks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .checks li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .checks .i {
        margin-top: 2px;
        width: 15px;
        height: 15px;
      }
      .checks .good .i {
        color: var(--success);
      }
      .checks .warn {
        color: var(--verify);
      }
      .choice-foot {
        margin-top: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding-top: 6px;
      }
      .choice-foot .btn {
        flex: 1;
      }
      .empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--bark);
      }

      /* Routines */
      .template {
        list-style: none;
        margin: 0;
        padding: 6px 0;
      }
      .template li {
        display: grid;
        grid-template-columns: 92px 1fr auto;
        gap: 10px;
        padding: 7px 16px;
        align-items: center;
        font-size: 13px;
        border-left: 3px solid transparent;
      }
      .template li .h {
        font:
          500 12px 'JetBrains Mono',
          monospace;
        color: var(--faint);
      }
      .template li.past {
        color: var(--faint);
      }
      .template li.current {
        border-left-color: var(--primary);
        background: var(--sand);
        font-weight: 600;
      }
      .template li.current .h {
        color: var(--primary);
      }
      .check-row {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 9px 16px;
        border-bottom: 1px dotted var(--rule);
        width: 100%;
        text-align: left;
      }
      .check-row:last-child {
        border-bottom: 0;
      }
      .box {
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--rule-strong);
        border-radius: 2px;
        display: grid;
        place-items: center;
        background: var(--paper);
      }
      .box .i {
        width: 13px;
        height: 13px;
        stroke-width: 2.4;
        opacity: 0;
      }
      .check-row.done .box {
        background: var(--success);
        border-color: var(--success);
        color: #fffdf9;
      }
      .check-row.done .box .i {
        opacity: 1;
      }
      .check-row.done .t {
        color: var(--faint);
        text-decoration: line-through;
      }
      .check-row.off {
        opacity: 0.55;
      }
      .check-row .t {
        font-weight: 500;
      }
      .ring {
        --p: 50;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: conic-gradient(var(--success) calc(var(--p) * 1%), var(--clay) 0);
        display: grid;
        place-items: center;
        flex: none;
      }
      .ring span {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--paper);
        display: grid;
        place-items: center;
        font:
          600 13px 'JetBrains Mono',
          monospace;
      }

      /* Agenda */
      .week {
        display: grid;
        grid-template-columns: 44px repeat(7, minmax(0, 1fr));
        position: relative;
      }
      .week .wh {
        font:
          500 11px 'JetBrains Mono',
          monospace;
        color: var(--bark);
        text-align: center;
        padding: 8px 4px;
        border-bottom: 1px solid var(--rule);
      }
      .week .wh b {
        display: block;
        font:
          600 16px 'JetBrains Mono',
          monospace;
        color: var(--ink);
      }
      .week .wh.today b {
        color: var(--on-primary);
        background: var(--primary);
        border-radius: 2px;
        display: inline-block;
        padding: 0 6px;
      }
      .week .gutter {
        position: relative;
      }
      .week .gutter span {
        position: absolute;
        right: 6px;
        font:
          500 10px 'JetBrains Mono',
          monospace;
        color: var(--faint);
        transform: translateY(-50%);
      }
      .week .col {
        position: relative;
        border-left: 1px solid var(--rule);
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 39px,
          var(--rule) 39px 40px
        );
      }
      .week .col.today {
        background-color: var(--sand);
      }
      .week .ev {
        position: absolute;
        left: 3px;
        right: 3px;
        border-radius: 2px;
        padding: 3px 5px;
        font-size: 11.5px;
        line-height: 1.2;
        overflow: hidden;
        border: 1px solid var(--rule-strong);
        background: var(--paper);
      }
      .week .ev small {
        display: block;
        font:
          10px 'JetBrains Mono',
          monospace;
        color: var(--bark);
      }
      .week .ev.routine {
        background: var(--clay);
        border-color: transparent;
        color: var(--bark);
      }
      .week .ev.event {
        border-color: var(--ink);
      }
      .week .ev.due {
        border-color: var(--primary);
        background: var(--paper);
        color: var(--primary);
      }
      .week .ev.proposed {
        background: var(--info-surface);
        border: 1px dashed var(--info);
        color: var(--info);
      }
      .week .nowline {
        position: absolute;
        left: 0;
        right: 0;
        height: 1.5px;
        background: var(--primary);
        z-index: 2;
      }

      /* Files */
      .ficon {
        width: 32px;
        height: 38px;
        border: 1px solid var(--rule-strong);
        border-radius: 2px;
        display: grid;
        place-items: end center;
        font:
          600 8.5px/1 'JetBrains Mono',
          monospace;
        padding-bottom: 5px;
        background: var(--paper);
        flex: none;
        position: relative;
      }
      .ficon::before {
        content: '';
        position: absolute;
        top: -1px;
        right: -1px;
        width: 9px;
        height: 9px;
        background: linear-gradient(225deg, var(--paper) 50%, var(--rule-strong) 50%);
      }
      .ficon.pdf {
        color: var(--error);
      }
      .ficon.img {
        color: var(--info);
      }
      .ficon.csv {
        color: var(--success);
      }
      .ficon.md {
        color: var(--bark);
      }
      .fname {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
      }
      .preview {
        border: 1px solid var(--rule);
        background: var(--sand);
        border-radius: 2px;
        aspect-ratio: 3 / 4;
        display: flex;
        flex-direction: column;
        padding: 18px;
        gap: 8px;
        overflow: hidden;
      }
      .preview .ln {
        height: 7px;
        background: var(--rule);
        border-radius: 1px;
      }
      .preview.img {
        aspect-ratio: 4 / 3;
        background: linear-gradient(160deg, var(--clay), var(--rule-strong));
        align-items: center;
        justify-content: center;
        color: var(--bark);
      }
      dl.meta {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 6px 12px;
        margin: 0;
        font-size: 13px;
      }
      dl.meta dt {
        color: var(--faint);
        font:
          500 11px/1.8 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      dl.meta dd {
        margin: 0;
      }

      /* Models */
      .model-card {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px dotted var(--rule);
        text-decoration: none;
      }
      .model-card:hover {
        background: var(--sand);
      }
      .model-card:last-child {
        border-bottom: 0;
      }
      .nature {
        font:
          500 11.5px 'JetBrains Mono',
          monospace;
        padding: 2px 6px;
        border-radius: 2px;
        background: var(--clay);
        color: var(--ink);
        white-space: nowrap;
      }
      .nature.ref {
        background: var(--info-surface);
        color: var(--info);
      }
      .nature.calc {
        background: var(--success-surface);
        color: var(--success);
      }
      .radio {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        cursor: pointer;
        background: var(--paper);
      }
      .radio:has(input:checked) {
        border-color: var(--ink);
        box-shadow: var(--shadow);
      }
      .radio input {
        accent-color: var(--primary);
        margin-top: 3px;
      }
      .path {
        font:
          500 12.5px 'JetBrains Mono',
          monospace;
        background: var(--sand);
        border: 1px solid var(--rule);
        padding: 2px 6px;
        border-radius: 2px;
        overflow-wrap: anywhere;
      }
      .rule-line {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 16px;
        border-bottom: 1px dotted var(--rule);
        font-size: 13px;
      }
      .rule-line:last-child {
        border-bottom: 0;
      }
      .kw {
        font:
          600 11px 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        color: var(--primary);
        letter-spacing: 0.04em;
        margin-right: 4px;
      }

      /* Forms, drawer, toast */
      .form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        overflow-y: auto;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font:
          500 11px 'JetBrains Mono',
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--bark);
        display: flex;
        justify-content: space-between;
      }
      .field label small {
        text-transform: none;
        letter-spacing: 0;
        color: var(--faint);
      }
      .field input,
      .field select {
        padding: 8px 10px;
        border: 1px solid var(--rule-strong);
        border-radius: 2px;
        background: var(--paper);
        width: 100%;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .warnbox {
        padding: 10px 12px;
        border: 1px solid var(--verify);
        background: var(--verify-surface);
        color: var(--verify);
        border-radius: 2px;
        font-size: 13px;
        display: none;
      }
      .warnbox.show {
        display: block;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(23, 16, 12, 0.32);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 20;
      }
      .scrim.open {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: min(420px, calc(100vw - 24px));
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        box-shadow: var(--shadow);
        z-index: 21;
        transform: translateX(calc(100% + 24px));
        transition: transform 0.25s ease;
        display: flex;
        flex-direction: column;
      }
      .drawer.open {
        transform: none;
      }
      .drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .drawer-head h2 {
        font-size: 16px;
      }
      .drawer-foot {
        padding: 12px 16px;
        border-top: 1px solid var(--rule);
        display: flex;
        gap: 8px;
      }
      .drawer-foot .btn {
        flex: 1;
      }
      .journal {
        list-style: none;
        margin: 0;
        padding: 4px 16px;
        overflow-y: auto;
      }
      .journal li {
        display: grid;
        grid-template-columns: 46px 1fr auto;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px dotted var(--rule);
        font-size: 13px;
        align-items: start;
      }
      .journal time {
        font:
          500 11.5px/1.6 'JetBrains Mono',
          monospace;
        color: var(--faint);
      }
      .journal small {
        display: block;
        color: var(--bark);
        font-size: 12px;
      }
      .journal .undo {
        font-size: 12px;
        font-weight: 600;
        color: var(--primary);
      }
      .journal li.undone {
        opacity: 0.45;
        text-decoration: line-through;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 120px);
        opacity: 0;
        pointer-events: none;
        background: var(--ink);
        color: var(--on-ink);
        padding: 10px 12px 10px 16px;
        border-radius: 2px;
        display: flex;
        gap: 16px;
        align-items: center;
        z-index: 30;
        transition:
          transform 0.25s ease,
          opacity 0.25s;
        box-shadow: var(--shadow);
        font-size: 13px;
        max-width: calc(100vw - 32px);
      }
      .toast.show {
        transform: translate(-50%, 0);
        opacity: 1;
        pointer-events: auto;
      }
      .toast button {
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      @media (max-width: 1180px) {
        .g4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g3,
        .g21,
        .g12 {
          grid-template-columns: minmax(0, 1fr);
        }
        .span2 {
          grid-column: auto;
        }
      }
      @media (max-width: 980px) {
        .board {
          grid-template-columns: 1fr;
        }
        .board.reading .list-panel {
          display: none;
        }
        .board:not(.reading) .detail {
          display: none;
        }
        .back {
          display: inline-flex !important;
        }
        .g2 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
          padding: 0;
        }
        main {
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        aside.side {
          position: fixed;
          z-index: 22;
          inset: 0 auto 0 0;
          width: 280px;
          background: var(--canvas);
          padding: 12px;
          transform: translateX(-100%);
          transition: transform 0.25s ease;
        }
        aside.side.open {
          transform: none;
        }
        .only-mobile {
          display: grid;
        }
        .page {
          padding: 16px;
        }
        .hide-s {
          display: none !important;
        }
        .g4 {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 10px;
        }
        .kpi .v {
          font-size: 20px;
        }
        .head-actions {
          width: 100%;
        }
        .hbar {
          grid-template-columns: 84px 1fr 74px;
        }
        .week {
          min-width: 640px;
        }
        .field-row {
          grid-template-columns: 1fr;
        }
      }
      .back {
        display: none;
        align-items: center;
        gap: 6px;
        color: var(--bark);
        font-size: 13px;
      }

      function regularity() {
        const days = 28,
          todayIdx = 27;
        const seed = (s) => {
          let x = 0;
          for (const c of s) x = (x * 31 + c.charCodeAt(0)) % 9973;
          return x;
        };
        const cell = (h, d) => {
          const dow = (d + 4) % 7; // day 0 = Saturday 3 Oct… keeps the pattern stable
          const off =
            (h.cad === 'lun–ven' && (dow === 0 || dow === 1)) ||
            (h.cad.startsWith('mar') && ![3, 4, 0].includes(dow));
          if (off) return 'off';
          if (d > todayIdx) return '';

            return state.checks[h.id] === 'done'
              ? 'l3'
              : state.checks[h.id] === 'partial'
                ? 'l1'
                : '';
          const r = seed(h.id + d) % 100;
          return r < h.rate - 15 ? 'l3' : r < h.rate ? 'l2' : r < h.rate + 10 ? 'l1' : '';
        };
        const cols = `150px repeat(${days}, minmax(8px, 1fr))`;
        const daynums = Array.from({ length: days }, (_, i) => {
          const n = i + 3;

    ${HABITS.map((h) => `<span class="lbl">${h.name}</span>${Array.from({ length: days }, (_, d) => `<span class="c ${cell(h, d)} ${d === todayIdx ? 'today' : ''}" title="${h.name} · ${daynums[d]}"></span>`).join('')}`).join('')}</div>

        const pts = [
          62, 70, 68, 75, 71, 79, 82, 77, 74, 80, 83, 78, 81, 85, 79, 82, 84, 80, 76, 82, 86, 83,

        openDrawer(`<div class="drawer-head"><div><h2>Ajouter un mouvement</h2><span class="muted" style="font-size:12px">formulaire tiré du modèle « Mouvement »</span></div><button class="icon-btn" data-close aria-label="Fermer">${icon('i-x')}</button></div>
  <form class="form" id="move-form">
    <div class="field-row"><div class="field"><label>Montant</label><input id="m-amt" class="mono" inputmode="numeric" value="2500"></div><div class="field"><label>Nature</label><select id="m-nat"><option value="-1">sortie</option><option value="1">entrée</option></select></div></div>
    <div class="field"><label>Libellé</label><input id="m-label" value="Crédit téléphone"></div>
    <div class="field-row"><div class="field"><label>Compte <small>où</small></label><select id="m-acc"><option value="">à préciser</option>${ACCOUNTS.filter(
      (a) => a.cur === 'XOF',
    )
      .map((a) => `<option value="${a.id}" ${a.id === 'cash' ? 'selected' : ''}>${a.name}</option>`)
      .join('')}</select></div>
      <div class="field"><label>Fonds <small>pour quoi</small></label><select id="m-fund">${FUNDS.map((f) => `<option value="${f.id}">${f.name}${f.status !== 'actif' ? ' · ' + f.status : ''}</option>`).join('')}</select></div></div>
    <div class="warnbox" id="m-warn"><b>Fonds ${'protégé'}.</b> Ta règle : il ne finance pas un autre objet sans exception explicite et plan de restauration. Indique l’exception, ou change de fonds.</div>
    <div class="field-row"><div class="field"><label>Catégorie</label><select id="m-cat">${['Divers', 'Repas', 'Transport', 'Abonnements', 'Offrandes', 'Santé'].map((c) => `<option>${c}</option>`).join('')}</select></div><div class="field"><label>Date et heure</label><input class="mono" value="30/10/2026 10:41"></div></div>
    <div class="field"><label>Justificatif <small>facultatif</small></label><input type="file"></div>
  </form>
  <div class="drawer-foot"><button class="btn" data-close>Annuler</button><button class="btn solid" id="m-save">${icon('i-check')}Enregistrer</button></div>`);
        const sync = () => {
          const f = fundOf($('m-fund').value);
          const warn = f.status !== 'actif' && $('m-nat').value === '-1';
          $('m-warn').classList.toggle('show', warn);
          $('m-warn').querySelector('b').textContent = `Fonds ${f.status}.`;
        };
        $('m-fund').addEventListener('change', sync);
        $('m-nat').addEventListener('change', sync);
      }

      // ——— Drawer, journal, toast ———
      function openDrawer(html) {
        $('drawer').innerHTML = html;
        $('drawer').classList.add('open');
        $('scrim').classList.add('open');
      }
      function closeAll() {
        ['drawer', 'scrim', 'side', 'me-menu'].forEach((id) => $(id).classList.remove('open'));
      }
      function journalDrawer() {
        openDrawer(`<div class="drawer-head"><div><h2>Journal</h2><span class="muted" style="font-size:12px">Chaque changement, qui l’a fait, et son annulation</span></div><button class="icon-btn" data-close aria-label="Fermer">${icon('i-x')}</button></div>
  <ul class="journal">${state.journal.map((j, i) => `<li class="${j.undone ? 'undone' : ''}"><time>${j.at}</time><span>${esc(j.text)}<small>par toi · depuis l’app</small></span>${j.undone ? '' : `<button class="undo" data-undo="${i}">Annuler</button>`}</li>`).join('')}
  ${[
    ['09:16', 'Dîme de 18 500 F proposée et confirmée', 'par Claude · règle du modèle Mouvement'],
    ['08:12', 'Petit-déjeuner, 650 F', 'par Claude · tu l’as dit sur Telegram'],
    ['04:35', 'Prière du matin faite à 4:35', 'par Claude · « prière faite, 4h35 »'],
    ['00:00', 'Rappels de la journée planifiés', 'par le veilleur'],
  ]
    .map(
      ([t, a, b]) =>
        `<li><time>${t}</time><span>${a}<small>${b}</small></span><button class="undo">Annuler</button></li>`,
    )
    .join('')}</ul>`);
      }
      let toastTimer;
      function log(text, undo) {
        state.journal.unshift({ at: '10:41', text, undo, undone: false });
        $('toast-text').textContent = text;
        $('toast-undo').style.display = '';
        state.toastUndo = 0;
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $('toast').classList.remove('show'), 5000);
      }
      function undo(i) {
        const j = state.journal[i];
        if (!j || j.undone) return;
        j.undone = true;
        j.undo && j.undo();
        render();
        $('toast-text').textContent = 'Annulé : ' + j.text;
        $('toast-undo').style.display = 'none';
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
        if ($('drawer').classList.contains('open') && $('drawer').querySelector('.journal'))
          journalDrawer();
      }
      function download(name) {
        const blob = new Blob(
          [
            `Fichier de démonstration : ${name}\n(dans l’app, le vrai fichier arrive depuis le stockage privé)\n`,
          ],
          { type: 'text/plain' },
        );
        const a = Object.assign(document.createElement('a'), {
          href: URL.createObjectURL(blob),
          download: name + '.txt',
        });
        document.body.append(a);
        a.click();
        a.remove();
      }

      // ——— Router ———
      // Routes live in `state.route`; the hash follows when the page allows it.
      function go(route) {
        state.route = route || 'maintenant';
        state.reading = false;
        try {
          history.replaceState(null, '', '#' + state.route);
        } catch {
          /* a sandboxed preview */
        }
        render();
        $('page').scrollTop = 0;
        closeAll();
      }
      function render() {
        const [top, sub] = state.route.split('/');
        drawNav();
        const pages = {
          maintenant: pageMaintenant,
          agenda: pageAgenda,
          tableaux: pageTableaux,
          fichiers: pageFichiers,
          nouvelle: pageNouvelle,
          finances: () => pageFinances(sub || 'apercu'),
          routines: () => pageRoutines(sub || 'aujourdhui'),
          modeles: () => pageModeles(sub && decodeURIComponent(sub)),
          entrees: () => pageSimple('Entrées', 'Toutes tes entrées, par type et par espace'),
          documents: () => pageSimple('Documents', 'Tes théories et documents complets'),
        };
        $('page').innerHTML = (pages[top] || pageMaintenant)();
      }
      window.addEventListener('hashchange', () => go(location.hash.slice(1)));

      document.addEventListener('click', (e) => {
        const t = e.target.closest('button, a, tr[data-file]');
        if (!t) {
          $('me-menu').classList.remove('open');
          return;
        }
        const d = t.dataset;
        if (d.filter) {
          state.filter = d.filter;
          render();
        } else if (d.pick) {
          state.selected = d.pick;
          state.reading = true;
          render();
        } else if ('back' in d) {
          state.reading = false;
          render();
        } else if (d.act) {
          const [id, ci, ai] = d.act.split(':');
          const it = NOWITEMS.find((x) => x.id === id);
          state.done.add(id);
          state.reading = false;
          render();
          log(it.choices[ci].actions[ai][2], () => {
            state.done.delete(id);
            state.selected = id;
          });
        } else if (d.mf) {
          state.moveFilter = d.mf;
          if (t.tagName === 'A') {
            e.preventDefault();
            go('finances/mouvements');
            return;
          }
          render();
        } else if (d.ff) {
          state.fileFilter = d.ff;
          render();
        } else if (d.check) {
          const h = d.check,
            before = state.checks[h];
          state.checks[h] = before === 'done' ? 'todo' : 'done';
          render();
          const name = HABITS.find((x) => x.id === h).name;
          log(state.checks[h] === 'done' ? `${name} : fait à 10:41` : `${name} : décoché`, () => {
            state.checks[h] = before;
          });
        } else if ('addMove' in d) {
          e.preventDefault();
          moveDrawer();
        } else if (t.id === 'm-save') {
          const amt = Number($('m-amt').value.replace(/\D/g, '')) * Number($('m-nat').value);
          const fund = $('m-fund').value,
            acc = $('m-acc').value || null;
          const mv = {
            d: '30 oct.',
            h: '10:41',
            label: $('m-label').value || 'Mouvement',
            cat: $('m-cat').value,
            acc,
            fund,
            amt,
            st: acc ? 'confirmé' : 'à réconcilier',
            o: 'said',
            fresh: true,
            note: acc ? '' : 'compte à préciser',
          };
          MOVES.unshift(mv);
          go('finances/mouvements');
          log(`${mv.label}, ${money(amt, 'XOF', true)} noté`, () => {
            MOVES = MOVES.filter((m) => m !== mv);
          });
          mv.fresh = false;
        } else if (d.dl) {
          e.stopPropagation();
          download(d.dl);
          log(`${d.dl} téléchargé`);
        } else if (d.file) {
          fileDrawer(d.file);
        } else if (d.undo) {
          undo(Number(d.undo));
        } else if (t.id === 'toast-undo') {
          undo(state.toastUndo);
        } else if ('close' in d) {
          closeAll();
        } else if (t.id === 'open-journal') {
          journalDrawer();
        } else if (t.id === 'open-side') {
          $('side').classList.add('open');
          $('scrim').classList.add('open');
          return;
        } else if (t.id === 'me') {
          $('me-menu').classList.toggle('open');
          return;
        } else if (d.go) {
          go(d.go);
        } else if (t.id === 'theme') {
          const r = document.documentElement;
          const dark = r.dataset.theme
            ? r.dataset.theme === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          r.dataset.theme = dark ? 'light' : 'dark';
        } else if (
          t.tagName === 'A' &&
          (t.getAttribute('href') || '').startsWith('#') &&
          t.getAttribute('href').length > 1
        ) {
          e.preventDefault();
          go(t.getAttribute('href').slice(1));
        }
        if (t.getAttribute && t.getAttribute('href') === '#') e.preventDefault();
        $('me-menu').classList.remove('open');
      });
      document.addEventListener('change', (e) => {
        if (e.target.name === 'rg') {
          state.rangement = e.target.value;
          render();
        }
      });
      $('scrim').addEventListener('click', closeAll);
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          $('search').focus();
        }
        if (e.key === 'Escape') closeAll();
      });
      state.route = location.hash.slice(1) || 'maintenant';
      render();
    </script>
  </body>
</html>
